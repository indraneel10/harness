apiVersion: apps/v1
kind: Deployment
metadata:
  name: wes-item-service
  labels:
    app: wes-item-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wes-item-service
  template:
    metadata:
      labels:
        app: wes-item-service
    spec:
      containers:
        - name: wes-item-service
          # Harness resolves these expressions before the manifest is applied.
          image: <+artifacts.primary.imagePath>:<+artifacts.primary.tag>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
              # Adjust this to the application's actual startup time.
            periodSeconds: 20
